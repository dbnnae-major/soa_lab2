openapi: 3.0.4
info:
  title: Dragon Collection API
  version: 1.0.0
  description: REST API для управления коллекцией объектов Dragon. Документация содержит XML-схемы, успешные ответы и конкретные
    примеры ошибок валидации, обработки Java-приложением и недоступности PostgreSQL.
tags:
- name: Dragons
  description: Базовые операции управления коллекцией Dragon
- name: Dragon Operations
  description: Дополнительные операции над коллекцией Dragon
paths:
  /dragons:
    get:
      tags:
      - Dragons
      summary: Получить список драконов
      description: 'Возвращает список объектов Dragon. Поддерживает фильтрацию по любому набору полей, сортировку по одному
        или нескольким полям и постраничный вывод результатов.

        '
      operationId: getDragons
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы, начиная с 0
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: pageSize
        in: query
        required: false
        description: Количество объектов на одной странице
        schema:
          type: integer
          minimum: 1
          default: 10
      - name: sort
        in: query
        required: false
        description: 'Параметры сортировки. Можно указать несколько значений. Формат каждого значения: field,direction. Например:
          sort=name,asc&sort=age,desc

          '
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^(id|name|coordinates\.x|coordinates\.y|creationDate|age|wingspan|speaking|color|killer\.name|killer\.birthday|killer\.nationality),(asc|desc)$
      - name: id
        in: query
        required: false
        description: Фильтр по идентификатору дракона
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: name
        in: query
        required: false
        description: Фильтр по имени дракона
        schema:
          type: string
          minLength: 1
      - name: coordinates.x
        in: query
        required: false
        description: Фильтр по координате X
        schema:
          type: integer
          format: int64
          minimum: -842
      - name: coordinates.y
        in: query
        required: false
        description: Фильтр по координате Y
        schema:
          type: number
          format: float
      - name: creationDate
        in: query
        required: false
        description: Фильтр по дате создания
        schema:
          type: string
          format: date-time
      - name: age
        in: query
        required: false
        description: Фильтр по возрасту
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: wingspan
        in: query
        required: false
        description: Фильтр по размаху крыльев
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: speaking
        in: query
        required: false
        description: Фильтр по способности дракона говорить
        schema:
          type: boolean
      - name: color
        in: query
        required: false
        description: Фильтр по цвету дракона
        schema:
          $ref: '#/components/schemas/Color'
      - name: killer.name
        in: query
        required: false
        description: Фильтр по имени убийцы дракона
        schema:
          type: string
          minLength: 1
      - name: killer.birthday
        in: query
        required: false
        description: Фильтр по дате рождения убийцы
        schema:
          type: string
          format: date-time
      - name: killer.nationality
        in: query
        required: false
        description: Фильтр по национальности убийцы
        schema:
          $ref: '#/components/schemas/Country'
      responses:
        '200':
          description: Список драконов успешно получен. Если совпадений нет, возвращается 200 с пустым массивом.
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dragon'
                xml:
                  name: dragons
                  wrapped: true
              examples:
                nonEmpty:
                  summary: Непустая коллекция
                  value:
                  - &id001
                    id: 1
                    name: Smaug
                    coordinates: &id002
                      x: 100
                      y: 45.5
                    creationDate: '2026-09-25T12:00:00'
                    age: 250
                    wingspan: 80
                    speaking: true
                    color: ORANGE
                    killer: &id003
                      name: Bard
                      birthday: '1995-04-12T10:30:00'
                      nationality: FRANCE
                  - &id004
                    id: 2
                    name: Alduin
                    coordinates:
                      x: 25
                      y: 70.0
                    creationDate: '2026-09-25T12:05:00'
                    age: 500
                    wingspan: 120
                    speaking: true
                    color: BLUE
                    killer: null
                empty:
                  summary: Пустая коллекция — это успешный ответ 200
                  value: []
        '400':
          description: Некорректный синтаксис или формат query-параметров
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                pageNotInteger:
                  summary: page имеет неверный тип
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Параметр page должен быть целым числом.
                    instance: /dragons?page=abc
                badSort:
                  summary: Некорректная сортировка
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Параметр sort должен иметь формат field,asc или field,desc.
                    instance: /dragons?sort=name,up
                badBoolean:
                  summary: Некорректное boolean-значение
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Параметр speaking должен иметь значение true или false.
                    instance: /dragons?speaking=yes
                badEnum:
                  summary: Неизвестное значение перечисления
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Параметр color должен иметь одно из значений GREEN, BLUE, YELLOW, ORANGE.
                    instance: /dragons?color=RED
        '404':
          description: Запрошенный API-ресурс не найден
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                resourceNotFound:
                  summary: Ресурс API отсутствует
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Запрошенный API-ресурс не существует.
                    instance: /dragons
        '405':
          description: Использован неподдерживаемый HTTP-метод
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                wrongMethod:
                  summary: Метод не разрешён для ресурса
                  value:
                    type: about:blank
                    title: Method Not Allowed
                    status: 405
                    detail: Для ресурса /dragons разрешены только методы GET и POST.
                    instance: /dragons
          headers:
            Allow:
              description: HTTP-методы, разрешённые для данного ресурса.
              schema:
                type: string
              example: GET, POST
        '422':
          description: Параметры имеют корректный формат, но нарушают ограничения
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                pageSizeZero:
                  summary: Недопустимый размер страницы
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр pageSize должен быть больше 0.
                    instance: /dragons?pageSize=0
                ageZero:
                  summary: Недопустимый возраст
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр age должен быть больше 0.
                    instance: /dragons?age=0
                xBoundary:
                  summary: Нарушено ограничение coordinates.x
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр coordinates.x должен быть больше -843.
                    instance: /dragons?coordinates.x=-843
                emptyName:
                  summary: Пустая строка в фильтре
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр name не может быть пустой строкой.
                    instance: /dragons?name=
        '500':
          description: Ошибка внутренней обработки данных Java-приложением
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                mappingFailure:
                  summary: Ошибка преобразования данных
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-сервис получил записи Dragon, но не смог преобразовать одну из них в доменную модель из-за
                      внутренней ошибки маппинга.
                    instance: /dragons
                serializationFailure:
                  summary: Ошибка XML-сериализации
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-сервис не смог сериализовать сформированный список Dragon в XML из-за внутренней ошибки сериализации.
                    instance: /dragons
        '406':
          description: Сервис не может сформировать представление в запрошенном формате
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                jsonNotSupported:
                  summary: Клиент запросил неподдерживаемый формат
                  value:
                    type: about:blank
                    title: Not Acceptable
                    status: 406
                    detail: 'Запрошен Accept: application/json, но успешный ответ этой операции предоставляется в application/xml.'
                    instance: /dragons
        '503':
          description: Сервис временно не может обработать запрос
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                postgresDown:
                  summary: PostgreSQL недоступен
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Соединение с PostgreSQL установить не удалось; сервис временно не может получить коллекцию Dragon.
                    instance: /dragons
                poolExhausted:
                  summary: Исчерпан пул соединений
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Пул соединений Java-приложения с PostgreSQL временно исчерпан.
                    instance: /dragons
          headers:
            Retry-After:
              description: Рекомендуемое время ожидания перед повторной попыткой, в секундах.
              schema:
                type: integer
                minimum: 1
              example: 30
    post:
      tags:
      - Dragons
      summary: Добавить нового дракона
      description: 'Создаёт новый объект Dragon. Поля id и creationDate генерируются сервером автоматически и не передаются
        клиентом.

        '
      operationId: createDragon
      requestBody:
        required: true
        description: Данные нового дракона в формате XML
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/DragonInput'
      responses:
        '201':
          description: Дракон успешно создан
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
              examples:
                created:
                  summary: Созданный Dragon
                  value: *id001
        '400':
          description: Тело запроса отсутствует или содержит некорректный XML
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                emptyBody:
                  summary: Пустое тело запроса
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Для создания Dragon требуется XML-тело запроса.
                    instance: /dragons
                malformedXml:
                  summary: Синтаксически некорректный XML
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: 'XML-документ не удалось разобрать: нарушена структура XML.'
                    instance: /dragons
                wrongRoot:
                  summary: Неверный корневой элемент
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Корневым элементом XML должен быть <dragon>.
                    instance: /dragons
        '404':
          description: Запрошенный API-ресурс не найден
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                resourceNotFound:
                  summary: Ресурс API отсутствует
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Запрошенный API-ресурс не существует.
                    instance: /dragons
        '405':
          description: Использован неподдерживаемый HTTP-метод
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                wrongMethod:
                  summary: Метод не разрешён для ресурса
                  value:
                    type: about:blank
                    title: Method Not Allowed
                    status: 405
                    detail: Для ресурса /dragons разрешены только методы GET и POST.
                    instance: /dragons
          headers:
            Allow:
              description: HTTP-методы, разрешённые для данного ресурса.
              schema:
                type: string
              example: GET, POST
        '415':
          description: Неподдерживаемый Content-Type
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                jsonBody:
                  summary: Передан JSON вместо XML
                  value:
                    type: about:blank
                    title: Unsupported Media Type
                    status: 415
                    detail: Для создания Dragon Content-Type должен быть application/xml.
                    instance: /dragons
                textBody:
                  summary: Передан текстовый формат
                  value:
                    type: about:blank
                    title: Unsupported Media Type
                    status: 415
                    detail: Content-Type text/plain не поддерживается; требуется application/xml.
                    instance: /dragons
        '422':
          description: XML корректен, но поля Dragon нарушают ограничения модели
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                missingName:
                  summary: Отсутствует обязательное имя
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Поле name обязательно и не может быть пустым.
                    instance: /dragons
                wingspanZero:
                  summary: Некорректный wingspan
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Поле wingspan должно быть больше 0.
                    instance: /dragons
                badX:
                  summary: Некорректная координата X
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Поле coordinates.x должно быть больше -843.
                    instance: /dragons
                badColor:
                  summary: Некорректный Color
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Поле color должно иметь одно из значений GREEN, BLUE, YELLOW, ORANGE.
                    instance: /dragons
        '500':
          description: Ошибка внутренней обработки операции создания
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                transactionFailure:
                  summary: Внутренняя ошибка транзакции
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-приложение начало создание Dragon, но транзакция была откатана из-за внутренней ошибки слоя
                      хранения.
                    instance: /dragons
                serializationFailure:
                  summary: Ошибка формирования ответа
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Dragon был обработан приложением, но Java-сервис не смог сформировать XML-ответ из-за внутренней
                      ошибки сериализации.
                    instance: /dragons
        '406':
          description: Сервис не может сформировать представление в запрошенном формате
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                jsonNotSupported:
                  summary: Неподдерживаемый Accept
                  value:
                    type: about:blank
                    title: Not Acceptable
                    status: 406
                    detail: 'Запрошен Accept: application/json, но созданный Dragon возвращается в application/xml.'
                    instance: /dragons
        '413':
          description: Размер XML-тела превышает допустимый предел
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                bodyTooLarge:
                  summary: Слишком большое тело запроса
                  value:
                    type: about:blank
                    title: Content Too Large
                    status: 413
                    detail: Размер XML-тела запроса превышает установленный сервером предел для создания Dragon.
                    instance: /dragons
        '503':
          description: Хранилище временно недоступно
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                postgresDown:
                  summary: PostgreSQL недоступен
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Java-сервис не может создать Dragon, потому что PostgreSQL временно недоступен.
                    instance: /dragons
                poolExhausted:
                  summary: Нет свободного соединения с БД
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Пул соединений с PostgreSQL временно исчерпан; операция создания не может быть начата.
                    instance: /dragons
          headers:
            Retry-After:
              description: Рекомендуемое время ожидания перед повторной попыткой, в секундах.
              schema:
                type: integer
                minimum: 1
              example: 30
  /dragons/{id}:
    get:
      tags:
      - Dragons
      summary: Получить дракона по ID
      description: Возвращает объект Dragon с указанным уникальным идентификатором.
      operationId: getDragonById
      parameters:
      - name: id
        in: path
        required: true
        description: Уникальный идентификатор дракона
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Дракон успешно найден
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
              examples:
                found:
                  summary: Dragon найден
                  value: *id001
        '400':
          description: ID имеет неверный формат
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                notInteger:
                  summary: ID не является целым числом
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Параметр id должен быть целым числом.
                    instance: /dragons/abc
        '404':
          description: Запрошенный API-ресурс не найден
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                resourceNotFound:
                  summary: Dragon или API-ресурс отсутствует
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Запрошенный API-ресурс не существует.
                    instance: /dragons/999
        '405':
          description: Использован неподдерживаемый HTTP-метод
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                wrongMethod:
                  summary: Метод не разрешён
                  value:
                    type: about:blank
                    title: Method Not Allowed
                    status: 405
                    detail: Для ресурса /dragons/{id} разрешены методы GET, PUT и DELETE.
                    instance: /dragons/1
          headers:
            Allow:
              description: HTTP-методы, разрешённые для данного ресурса.
              schema:
                type: string
              example: GET, PUT, DELETE
        '422':
          description: ID нарушает ограничение модели
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                nonPositiveId:
                  summary: ID не положительный
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр id должен быть больше 0.
                    instance: /dragons/0
        '500':
          description: Ошибка внутренней обработки Dragon
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                mappingFailure:
                  summary: Ошибка ORM/маппинга
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Запись Dragon была получена из хранилища, но Java-приложение не смогло преобразовать её в доменную
                      модель.
                    instance: /dragons/1
                serializationFailure:
                  summary: Ошибка XML-сериализации
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-сервис не смог сериализовать найденный объект Dragon в XML.
                    instance: /dragons/1
        '406':
          description: Сервис не может вернуть Dragon в запрошенном формате
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                jsonNotSupported:
                  summary: Неподдерживаемый Accept
                  value:
                    type: about:blank
                    title: Not Acceptable
                    status: 406
                    detail: 'Запрошен Accept: application/json, но Dragon возвращается в application/xml.'
                    instance: /dragons/1
        '503':
          description: Хранилище временно недоступно
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                postgresDown:
                  summary: PostgreSQL недоступен
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Соединение с PostgreSQL установить не удалось, поэтому Dragon не может быть прочитан.
                    instance: /dragons/1
                poolExhausted:
                  summary: Исчерпан пул соединений
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Нет свободного соединения Java-приложения с PostgreSQL.
                    instance: /dragons/1
          headers:
            Retry-After:
              description: Рекомендуемое время ожидания перед повторной попыткой, в секундах.
              schema:
                type: integer
                minimum: 1
              example: 30
    put:
      tags:
