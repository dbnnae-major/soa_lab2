                  name: dragons
                  wrapped: true
              examples:
                matches:
                  summary: Найдены подходящие Dragon
                  value:
                  - *id004
                empty:
                  summary: Совпадений нет — возвращается пустой массив
                  value: []
        '400':
          description: Обязательный параметр killerName отсутствует или имеет неверный формат
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                missingParameter:
                  summary: killerName не передан
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Обязательный query-параметр killerName не передан.
                    instance: /dragons/killer/greater-than
        '404':
          description: Запрошенный API-ресурс не найден
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                resourceNotFound:
                  summary: Ресурс API отсутствует
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: Запрошенный API-ресурс не существует.
                    instance: /dragons/killer/greater-than
        '405':
          description: Использован неподдерживаемый HTTP-метод
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                wrongMethod:
                  summary: Метод не разрешён
                  value:
                    type: about:blank
                    title: Method Not Allowed
                    status: 405
                    detail: Для ресурса /dragons/killer/greater-than разрешён только метод GET.
                    instance: /dragons/killer/greater-than
          headers:
            Allow:
              description: HTTP-методы, разрешённые для данного ресурса.
              schema:
                type: string
              example: GET
        '422':
          description: Значение killerName нарушает ограничения
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                emptyValue:
                  summary: killerName пуст
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    detail: Параметр killerName не может быть пустой строкой.
                    instance: /dragons/killer/greater-than?killerName=
        '500':
          description: Ошибка внутренней обработки операции
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                queryFailure:
                  summary: Ошибка выполнения внутреннего запроса
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-сервис не смог выполнить запрос сравнения killer.name из-за внутренней ошибки построения
                      запроса.
                    instance: /dragons/killer/greater-than
                serializationFailure:
                  summary: Ошибка XML-сериализации
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: Java-сервис получил результат операции, но не смог сериализовать его в XML.
                    instance: /dragons/killer/greater-than
        '406':
          description: Сервис не может сформировать ответ в запрошенном формате
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                jsonNotSupported:
                  summary: Неподдерживаемый Accept
                  value:
                    type: about:blank
                    title: Not Acceptable
                    status: 406
                    detail: 'Запрошен Accept: application/json, но успешный ответ этой операции предоставляется в application/xml.'
                    instance: /dragons/killer/greater-than
        '503':
          description: PostgreSQL или пул соединений временно недоступны
          content:
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                postgresDown:
                  summary: PostgreSQL недоступен
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Java-сервис не может выполнить операцию, потому что PostgreSQL временно недоступен.
                    instance: /dragons/killer/greater-than
                poolExhausted:
                  summary: Исчерпан пул соединений
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    detail: Пул соединений Java-приложения с PostgreSQL временно исчерпан.
                    instance: /dragons/killer/greater-than
          headers:
            Retry-After:
              description: Рекомендуемое время ожидания перед повторной попыткой, в секундах.
              schema:
                type: integer
                minimum: 1
              example: 30
components:
  schemas:
    Dragon:
      type: object
      required:
      - id
      - name
      - coordinates
      - creationDate
      - wingspan
      - speaking
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Уникальный идентификатор дракона, генерируется автоматически
        name:
          type: string
          minLength: 1
          description: Имя дракона. Не может быть пустым
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
          description: Дата создания объекта, генерируется автоматически
        age:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Возраст дракона. Если указан, должен быть больше 0
        wingspan:
          type: integer
          format: int64
          minimum: 1
          description: Размах крыльев. Должен быть больше 0
        speaking:
          type: boolean
          description: Умеет ли дракон говорить
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          nullable: true
          description: Цвет дракона
        killer:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
          description: Человек, убивший дракона
      xml:
        name: dragon
    DragonInput:
      type: object
      required:
      - name
      - coordinates
      - wingspan
      - speaking
      properties:
        name:
          type: string
          minLength: 1
          description: Имя дракона. Не может быть пустым
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        age:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Возраст дракона. Если указан, должен быть больше 0
        wingspan:
          type: integer
          format: int64
          minimum: 1
          description: Размах крыльев. Должен быть больше 0
        speaking:
          type: boolean
          description: Умеет ли дракон говорить
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          nullable: true
        killer:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: dragon
    Coordinates:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
          format: int64
          minimum: -842
          description: Координата X. Значение должно быть больше -843
        y:
          type: number
          format: float
          description: Координата Y
      xml:
        name: coordinates
    Person:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Имя человека. Не может быть пустым
        birthday:
          type: string
          format: date-time
          nullable: true
          description: Дата рождения
        nationality:
          allOf:
          - $ref: '#/components/schemas/Country'
          nullable: true
          description: Национальность
      xml:
        name: person
    Color:
      type: string
      enum:
      - GREEN
      - BLUE
      - YELLOW
      - ORANGE
      description: Цвет дракона
    Country:
      type: string
      enum:
      - FRANCE
      - ITALY
      - JAPAN
      description: Страна
    ProblemDetails:
      type: object
      description: Стандартное XML-представление ошибки HTTP API (Problem Details).
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: URI типа проблемы; about:blank используется для стандартной HTTP-ошибки.
        title:
          type: string
          description: Краткое название класса HTTP-ошибки.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP-код ответа.
        detail:
          type: string
          description: Конкретная причина ошибки без stack trace и внутренних секретов.
        instance:
          type: string
          format: uri-reference
          description: URI запроса, для которого приведён пример ошибки.
      xml:
        name: problem
        namespace: urn:ietf:rfc:7807
